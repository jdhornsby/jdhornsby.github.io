title: Lab Notes
author: Josh Hornsby
description: >
  Field notes on building with AI.
url: "https://jdhornsby.com"

permalink: /:title/

theme: minima
minima:
  skin: classic
  date_format: "%Y-%m-%d"

show_excerpts: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - "*.json"
